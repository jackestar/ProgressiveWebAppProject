[build]
  base = "PWA/OpsmanagerApp"
  publish = "dist"
  command = "node generate-icons.js && pnpm run build"

[context.deploy-preview]
  command = "node generate-icons.js && pnpm run build"

[context.branch-deploy]
  command = "node generate-icons.js && pnpm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200